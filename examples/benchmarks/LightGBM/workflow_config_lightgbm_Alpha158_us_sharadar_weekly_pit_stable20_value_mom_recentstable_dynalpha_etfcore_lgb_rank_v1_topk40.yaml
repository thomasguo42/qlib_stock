qlib_init:
  provider_uri: /root/.qlib/qlib_data/us_data
  region: us
  custom_ops:
  - class: IsNull
    module_path: qlib.contrib.ops.high_freq
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: /workspace/qlib/mlruns
      default_exp_name: us_sharadar_weekly_pit_stable20_value_mom_recentstable_dynalpha_etfcore_lgb_rank_v1_topk40
market: pit_mrq_large_idx
benchmark: AAPL
data_handler_config: &id001
  start_time: 2016-01-01
  end_time: 2026-04-30
  fit_start_time: 2016-01-01
  fit_end_time: '2020-12-02'
  instruments: pit_mrq_large_idx
  freq: day
  infer_processors:
  - class: SelectiveCSZScoreNorm
    module_path: qlib.contrib.data.processor
    kwargs:
      fields_group: feature
      method: robust
      exclude_prefixes:
      - MKT_
  learn_processors:
  - class: DropnaLabel
  - class: BenchmarkExcessLabel
    module_path: qlib.contrib.data.processor
    kwargs:
      benchmark_pkl: /root/.qlib/qlib_data/us_data/bench_etf_basket.pkl
      label_horizon_days: 20
      label_ref_start_days: 1
      fields_group: label
      benchmark_kind: return
      fill_method: ffill
      drop_missing: true
  - class: CSRankNorm
    kwargs:
      fields_group: label
  filter_pipe:
  - filter_type: ExpressionDFilter
    rule_expression: $close > 5
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  - filter_type: ExpressionDFilter
    rule_expression: Mean($close * $volume, 20) > 10000000
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  label:
  - - Ref($close, -21)/Ref($close, -1) - 1
  - - LABEL0
  pit_fields: []
  pit_interval: q
  extra_fields:
  - $cash_assets_q
  - $asset_turn_q
  - $div_yield_px_q
  - $earn_yield_q
  - $book_px_q
  - $fcf_yield_q
  - $risk_ret_20d
  - $risk_ret_63d
  - $risk_ret_252d
  - $risk_relret_spy_63d
  extra_names:
  - CASH_ASSETS_Q
  - ASSET_TURN_Q
  - DIV_YIELD_PX_Q
  - EARN_YIELD_Q
  - BOOK_PX_Q
  - FCF_YIELD_Q
  - RISK_RET_20D
  - RISK_RET_63D
  - RISK_RET_252D
  - RISK_RELRET_SPY_63D
port_analysis_config: &id002
  strategy:
    class: WeeklyBenchmarkAwareScoreWeightedStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      topk: 40
      rebalance_weekday: 0
      risk_degree: 0.95
      weighting: rank
      benchmark_core_weight: 0.5
      benchmark_topn: 7
      benchmark_marketcap_field: $marketcap_q
      max_weight: 0.2
      max_active_weight: 0.055
      sector_map_csv: /root/.qlib/sharadar/raw/tickers.csv
      sector_ticker_col: ticker
      sector_col: sector
      liquidity_window: 20
      liquidity_buffer: 3
      vol_window: 63
      vol_scale: false
      benchmark_tickers_file: /Stock/qlib/_sfp_benchmark_tickers.txt
      max_turnover: 0.1
      min_trade_weight: 0.001
      max_holdings: 90
      dynamic_alpha_weight: true
      alpha_quality_window: 189
      alpha_quality_lower_excess: 0.0
      alpha_quality_upper_excess: 0.04
      min_alpha_scale: 0.0
      max_sector_weight: 0.4
  backtest:
    start_time: 2022-01-01
    end_time: 2026-04-30
    account: 10000000
    benchmark: AAPL
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.02
      colsample_bytree: 0.9
      subsample: 0.9
      lambda_l1: 80.0
      lambda_l2: 300.0
      max_depth: 4
      num_leaves: 16
      min_data_in_leaf: 600
      num_threads: 20
      num_boost_round: 1000
      early_stopping_rounds: 80
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: SharadarFeatureHandler
        module_path: qlib.contrib.data.handler_sharadar
        kwargs: *id001
      segments:
        train:
        - 2016-01-01
        - '2020-12-02'
        valid:
        - 2021-01-04
        - '2021-12-02'
        test:
        - 2022-01-03
        - 2026-04-30
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs: {}
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
