port_analysis_config: &id002
  strategy:
    class: WeeklyBenchmarkAwareScoreWeightedStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      topk: 30
      rebalance_weekday: 0
      risk_degree: 1.0
      weighting: rank
      benchmark_core_weight: 0.55
      benchmark_topn: 1
      benchmark_marketcap_field: $marketcap_q
      max_weight: 0.16
      max_active_weight: 0.08
      sector_map_csv: /root/.qlib/sharadar/raw/tickers.csv
      sector_ticker_col: ticker
      sector_col: sector
      liquidity_window: 20
      liquidity_buffer: 3
      vol_window: 63
      vol_scale: true
      benchmark_tickers:
      - QQQ
      benchmark_max_weight: 1.0
      max_turnover: 0.12
      min_trade_weight: 0.001
      min_position_weight: 0.001
      max_holdings: 60
      dynamic_alpha_weight: true
      alpha_quality_window: 63
      alpha_quality_lower_excess: -0.02
      alpha_quality_upper_excess: 0.045
      min_alpha_scale: 0.45
      max_sector_weight: 0.3
      feature_score_weights:
        $log_marketcap_q: 0.08
        $risk_vol_20d: -0.06
        $risk_beta_qqq_63d: -0.04
        $fmp_alpha_event_composite: 0.03
      feature_min_percentiles:
        $log_marketcap_q: 0.25
      dynamic_risk: true
      market_index: QQQ
      risk_floor: 0.85
      risk_ceiling: 1.0
      risk_smoothing_up: 0.35
      risk_smoothing_down: 0.85
      max_risk_step_up: 0.1
      max_risk_step_down: 0.35
      market_trend_window: 63
      market_trend_thresh: -0.03
      market_trend_penalty: 0.96
      market_trend_boost_thresh: 0.1
      market_trend_boost: 1.0
      market_drawdown_window: 126
      market_drawdown_limit: 0.1
      market_drawdown_penalty: 0.92
      crash_guard: true
      crash_return_lookback: 5
      crash_return_limit: 0.06
      crash_penalty: 0.9
      crash_cooldown_steps: 2
      risk_min_history: 40
  backtest:
    start_time: 2022-01-01
    end_time: 2026-04-30
    account: 10000000
    benchmark: QQQ
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.006
      colsample_bytree: 0.7
      subsample: 0.8
      lambda_l1: 40.0
      lambda_l2: 200.0
      max_depth: 4
      num_leaves: 24
      min_data_in_leaf: 400
      num_threads: 20
      num_boost_round: 2800
      early_stopping_rounds: 160
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: SharadarFeatureHandler
        module_path: qlib.contrib.data.handler_sharadar
        kwargs: *id001
      segments:
        train:
        - '2022-01-03'
        - '2023-08-31'
        valid:
        - '2023-09-18'
        - '2023-12-29'
        test:
        - '2024-01-16'
        - '2026-04-30'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs: {}
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
