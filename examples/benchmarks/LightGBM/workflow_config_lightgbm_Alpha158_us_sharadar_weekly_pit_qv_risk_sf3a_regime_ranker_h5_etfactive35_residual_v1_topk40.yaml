qlib_init:
  provider_uri: /root/.qlib/qlib_data/us_data
  region: us
  custom_ops:
  - class: IsNull
    module_path: qlib.contrib.ops.high_freq
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: /workspace/qlib/mlruns
      default_exp_name: us_sharadar_weekly_pit_qv_risk_sf3a_regime_ranker_h5_etfactive35_residual_v1_topk40
market: pit_mrq_large_idx
benchmark: AAPL
data_handler_config: &id001
  start_time: 2016-01-01
  end_time: 2026-04-30
  fit_start_time: 2016-01-01
  fit_end_time: 2020-12-16
  instruments: pit_mrq_large_idx
  freq: day
  infer_processors:
  - class: SelectiveCSZScoreNorm
    module_path: qlib.contrib.data.processor
    kwargs:
      fields_group: feature
      method: robust
      exclude_prefixes:
      - MKT_
  learn_processors:
  - class: DropnaLabel
  - class: ResidualForwardReturnLabel
    module_path: qlib.contrib.data.processor
    kwargs:
      benchmark_pkl: /root/.qlib/qlib_data/us_data/bench_etf_basket.pkl
      label_horizon_days: 5
      label_ref_start_days: 1
      fields_group: label
      benchmark_kind: return
      fill_method: ffill
      drop_missing: true
      beta_feature: RISK_BETA_SPY_63D
      fallback_beta: 1.0
      beta_min: 0.0
      beta_max: 2.0
      fill_missing_beta: true
  - class: GroupNeutralize
    module_path: qlib.contrib.data.processor
    kwargs:
      group_map_csv: /root/.qlib/sharadar/raw/tickers.csv
      ticker_col: ticker
      group_col: sector
      fields_group: label
      min_group_size: 10
  filter_pipe:
  - filter_type: ExpressionDFilter
    rule_expression: $close > 5
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  - filter_type: ExpressionDFilter
    rule_expression: Mean($close * $volume, 20) > 10000000
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  label:
  - - Ref($close, -6)/Ref($close, -1) - 1
  - - LABEL0
  pit_fields: []
  pit_interval: q
  extra_fields:
  - $roe_q
  - $roa_q
  - $ebitda_margin_q
  - $fcf_margin_q
  - $leverage_q
  - $cash_assets_q
  - $capex_assets_q
  - $asset_turn_q
  - $div_yield_px_q
  - $earn_yield_q
  - $book_px_q
  - $fcf_yield_q
  - $risk_ret_20d
  - $risk_ret_63d
  - $risk_ret_252d
  - $risk_vol_20d
  - $risk_vol_63d
  - $risk_dvol_20d
  - $risk_beta_spy_63d
  - $risk_beta_spy_252d
  - $risk_relret_spy_63d
  - $risk_relret_spy_252d
  - $mkt_spy_ret_20d
  - $mkt_spy_ret_63d
  - $mkt_spy_vol_20d
  - $mkt_spy_dd_63d
  - $mkt_qqq_ret_63d
  - $mkt_qqq_vol_20d
  - $mkt_iwm_ret_63d
  - $mkt_iwm_vol_20d
  - $mkt_xlk_ret_63d
  - $mkt_xlf_ret_63d
  - $mkt_xlv_ret_63d
  - $mkt_xly_ret_63d
  - $mkt_xlp_ret_63d
  - $mkt_xle_ret_63d
  - $mkt_xli_ret_63d
  - $mkt_xlb_ret_63d
  - $mkt_xlu_ret_63d
  - $mkt_xlre_ret_63d
  - $mkt_xlc_ret_63d
  - $regime_beta_spy63_ret63
  - $regime_beta_spy63_dd63
  - $regime_vol20_spyvol20
  - $regime_relret63_spyret63
  - $regime_sector_relret63
  - $regime_sector_relret63_beta63
  - $inst13f_totalvalue_daily
  - $inst13f_totalvalue_20d_mean
  - $inst13f_percentoftotal_63d_mean
  - $inst13f_shrvalue_252d_pct
  extra_names:
  - ROE_Q
  - ROA_Q
  - EBITDA_MARGIN_Q
  - FCF_MARGIN_Q
  - LEVERAGE_Q
