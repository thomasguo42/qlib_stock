port_analysis_config: &id002
  strategy:
    class: WeeklyBenchmarkAwareScoreWeightedStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      topk: 30
      rebalance_weekday: 0
      risk_degree: 1.0
      weighting: rank
      benchmark_core_weight: 0.85
      benchmark_topn: 1
      benchmark_marketcap_field: $marketcap_q
      max_weight: 0.12
      max_active_weight: 0.08
      sector_map_csv: /root/.qlib/sharadar/raw/tickers.csv
      sector_ticker_col: ticker
      sector_col: sector
      liquidity_window: 20
      liquidity_buffer: 3
      vol_window: 63
      vol_scale: false
      benchmark_tickers:
      - QQQ
      benchmark_max_weight: 1.0
      max_turnover: 0.1
      min_trade_weight: 0.001
      min_position_weight: 0.001
      max_holdings: 55
      max_sector_weight: 0.35
      dynamic_alpha_weight: false
  backtest:
    start_time: 2022-01-01
    end_time: 2026-04-30
    account: 10000000
    benchmark: AAPL
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: StackedSignalScoreModel
    module_path: qlib.contrib.model.score
    kwargs:
      sleeves:
        fmp_event:
          FMP_ALPHA_EVENT_COMPOSITE: 1.0
          FMP_ALPHA_EARN_SURPRISE_LATEST: 0.8
          FMP_ALPHA_EARN_SURPRISE_20D: 0.65
          FMP_ALPHA_EARN_SURPRISE_63D: 0.35
          FMP_ALPHA_RATING_BULLISH: 0.7
          FMP_ALPHA_RATING_BEARISH_PENALTY: 0.7
          FMP_ALPHA_RATING_NET_CHANGE: 0.45
          FMP_ALPHA_GRADE_SCORE_LATEST: 0.45
          FMP_ALPHA_PT_UPSIDE_LATEST: 0.15
          FMP_ALPHA_EVENT_FRESHNESS: 0.1
        quality_value:
          FCF_YIELD_Q: 1.0
          EARN_YIELD_Q: 0.8
          BOOK_PX_Q: 0.55
          ROE_Q: 0.5
          FCF_MARGIN_Q: 0.35
          LEVERAGE_Q: -0.25
          RISK_VOL_20D: -0.25
        momentum_regime:
          RISK_RET_20D: 0.4
          RISK_RET_63D: 0.9
          RISK_RET_252D: 0.35
          RISK_RELRET_QQQ_63D: 0.65
          RISK_RELRET_QQQ_252D: 0.3
          LOG_MARKETCAP_Q: 0.2
          MKT_QQQ_RET_63D_LAG1: 0.1
      max_sleeves: 3
      min_selected_sleeves: 1
      min_abs_ic: 0.001
      min_ic_days: 60
      min_daily_count: 30
      min_coverage: 0.3
      min_recent_signed_ic: -0.006
      min_worst_year_signed_ic: -0.05
      recent_window_days: 756
      recent_weight: 0.65
      weight_power: 1.0
      normalize_by_date: true
      normalize_sleeve_scores_by_date: true
      missing: raise
      allow_negative_sleeve_weights: true
      fallback_to_equal: true
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: SharadarFeatureHandler
        module_path: qlib.contrib.data.handler_sharadar
        kwargs: *id001
      segments:
        train:
        - '2022-01-03'
        - '2023-08-31'
        valid:
        - '2023-09-18'
        - '2023-12-29'
        test:
        - '2024-01-16'
        - '2026-04-30'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs: {}
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
