  - INST13F_PERCENTOFTOTAL_63D_MEAN
  - INST13F_SHRVALUE_252D_PCT
port_analysis_config: &id002
  strategy:
    class: WeeklyBenchmarkAwareScoreWeightedStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      topk: 40
      rebalance_weekday: 0
      risk_degree: 0.95
      weighting: rank
      benchmark_core_weight: 0.65
      benchmark_topn: 7
      benchmark_marketcap_field: $marketcap_q
      max_weight: 0.2
      max_active_weight: 0.055
      sector_map_csv: /root/.qlib/sharadar/raw/tickers.csv
      sector_ticker_col: ticker
      sector_col: sector
      liquidity_window: 20
      liquidity_buffer: 3
      vol_window: 63
      vol_scale: false
      benchmark_tickers_file: /Stock/qlib/_sfp_benchmark_tickers.txt
      max_turnover: 0.1
      min_trade_weight: 0.001
      max_holdings: 70
      max_sector_weight: 0.35
      feature_score_weights:
        $log_marketcap_q: 0.15
        $risk_vol_20d: -0.2
        $risk_beta_spy_63d: -0.1
        $earn_yield_q: 0.07
        $fcf_yield_q: 0.07
      feature_min_percentiles:
        $log_marketcap_q: 0.2
  backtest:
    start_time: 2022-01-01
    end_time: 2026-04-30
    account: 10000000
    benchmark: AAPL
    exchange_kwargs:
      limit_threshold: null
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: LGBRankerModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      objective: lambdarank
      metric: ndcg
      eval_at:
      - 40
      - 100
      label_bins: 8
      learning_rate: 0.025
      colsample_bytree: 0.7
      subsample: 0.8
      subsample_freq: 1
      lambda_l1: 10.0
      lambda_l2: 120.0
      max_depth: 4
      num_leaves: 24
      min_data_in_leaf: 300
      num_threads: 20
      num_boost_round: 700
      early_stopping_rounds: 80
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158WithPIT
        module_path: qlib.contrib.data.handler_sharadar
        kwargs: *id001
      segments:
        train:
        - 2016-01-01
        - 2020-12-16
        valid:
        - 2021-01-04
        - 2021-12-16
        test:
        - 2022-01-03
        - 2026-04-30
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs: {}
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
