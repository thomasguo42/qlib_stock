qlib_init:
  provider_uri: /root/.qlib/qlib_data/us_data
  region: us
  custom_ops:
  - class: IsNull
    module_path: qlib.contrib.ops.high_freq
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: /workspace/qlib/mlruns
      default_exp_name: us_sharadar_weekly_pit_score_growth_v8_h10_qqqexcess_fmpv2_stack_core85_topk30
market: pit_mrq_large_idx
benchmark: AAPL
data_handler_config: &id001
  start_time: '2022-01-01'
  end_time: '2026-04-30'
  fit_start_time: '2022-01-03'
  fit_end_time: '2023-08-31'
  instruments: pit_mrq_large_idx
  freq: day
  infer_processors:
  - class: SelectiveCSZScoreNorm
    module_path: qlib.contrib.data.processor
    kwargs:
      fields_group: feature
      method: robust
      exclude_prefixes:
      - MKT_
  learn_processors:
  - class: DropnaLabel
  - class: BenchmarkExcessLabel
    module_path: qlib.contrib.data.processor
    kwargs:
      benchmark_pkl: /root/.qlib/qlib_data/us_data/bench_qqq.pkl
      benchmark_kind: return
      label_horizon_days: 10
      label_ref_start_days: 1
  filter_pipe:
  - filter_type: ExpressionDFilter
    rule_expression: $close > 5
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  - filter_type: ExpressionDFilter
    rule_expression: Mean($close * $volume, 20) > 10000000
    filter_start_time: 2016-01-01
    filter_end_time: 2026-04-30
    keep: false
  label:
  - - Ref($close, -11)/Ref($close, -1) - 1
  - - LABEL0
  pit_fields: []
  pit_interval: q
  extra_fields:
  - $roe_q
  - $roa_q
  - $ebitda_margin_q
  - $fcf_margin_q
  - $leverage_q
  - $cash_assets_q
  - $capex_assets_q
  - $asset_turn_q
  - $div_yield_px_q
  - $earn_yield_q
  - $book_px_q
  - $fcf_yield_q
  - $log_marketcap_q
  - $risk_ret_20d
  - $risk_ret_63d
  - $risk_ret_252d
  - $risk_relret_spy_63d
  - $inst13f_percentoftotal_63d_mean
  - $inst13f_shrvalue_252d_pct
  - $risk_vol_20d
  - $risk_beta_spy_63d
  - $risk_vol_63d
  - $risk_beta_qqq_63d
  - $risk_beta_qqq_252d
  - $risk_relret_qqq_63d
  - $risk_relret_qqq_252d
  - $mkt_spy_ret_63d_lag1
  - $mkt_spy_dd_126d_lag1
